/* ==== Liquid Glass design system: one set of materials, shapes and motion for every surface ==== */
:root{--lg-c:rgba(30,38,58,.42);--lg-p:rgba(22,30,50,.62);--lg-s:rgba(20,27,46,.86);--lg-m:rgba(20,27,46,.92);--lg-f:rgba(255,255,255,.08);--lg-card:rgba(255,255,255,.06);--lg-th:rgba(255,255,255,.17);--lg-r:rgba(255,255,255,.16);--lg-sp:rgba(255,255,255,.3);--lg-sp2:rgba(255,255,255,.12);--lg-rim:rgba(255,255,255,.07);--lg-sh:rgba(0,0,0,.34);--lg-sn:rgba(255,255,255,.13);--lg-spring:cubic-bezier(.3,1.35,.5,1);--lg-ease:cubic-bezier(.3,.8,.3,1)}
[data-theme=light]{--lg-c:rgba(255,255,255,.64);--lg-p:rgba(247,250,255,.68);--lg-s:rgba(250,252,255,.88);--lg-m:rgba(248,250,255,.94);--lg-f:rgba(30,45,80,.06);--lg-card:rgba(255,255,255,.5);--lg-th:rgba(255,255,255,.92);--lg-r:rgba(255,255,255,.65);--lg-sp:rgba(255,255,255,.95);--lg-sp2:rgba(255,255,255,.7);--lg-rim:rgba(255,255,255,.35);--lg-sh:rgba(40,60,100,.2);--lg-sn:rgba(255,255,255,.6)}
body{font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}

/* material */
.glass{position:relative;border:0;background:var(--lg-c);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);box-shadow:0 0 0 .5px var(--lg-r),inset 0 1px 0 var(--lg-sp),inset 0 -1px 1px var(--lg-rim),0 10px 28px var(--lg-sh)}
.glass::before{content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:linear-gradient(140deg,var(--lg-sn),transparent 34%,transparent 74%,var(--lg-rim))}
#panel{background:var(--lg-p);border-radius:34px}
.pcw,#tour,#rp,#ymenu,#lyp,#demob{background:var(--lg-s)}
.lite .glass{background:var(--glass-solid);-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
@media(prefers-reduced-transparency:reduce){.glass{background:var(--glass-solid);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* controls */

button:hover{background:var(--lg-th)}button:active{transform:scale(.95)}button:disabled{opacity:.55}
button.pri,#tour .tn{color:#201400;font-weight:700;background:linear-gradient(180deg,#ffc454,#f59e0b);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 1px rgba(150,80,0,.25),0 6px 16px rgba(245,158,11,.32)}button.pri:hover,#tour .tn:hover{background:linear-gradient(180deg,#ffcb68,#f8a81e)}
button.dg{color:var(--danger)}button.wi{color:var(--blue)}button.wi.on{background:rgba(106,168,255,.18)}
button.bk,button.gh,button.dclr,.pcg button,.pcst button,#zoom button,#lyp button,#ymenu button,#yin button,.seg button,#tabs button,#tour .ti,.sw,.bs{box-shadow:none}
button.bk:hover,button.gh:hover,button.dclr:hover,.pcg button:hover,.pcst button:hover,#tabs button:hover{background:none}

input:focus,textarea:focus,select:focus{outline:0;background:var(--lg-card);box-shadow:inset 0 0 0 1.5px var(--at),0 0 0 4px rgba(245,166,35,.13)}
#q,#ff,#bpc,#pcto,#pcem,#pcfrom,select,.pcr select{border-radius:999px}#q{padding:11px 42px 11px 18px}.ftb input{padding:8px 16px}
.pcr textarea{border-radius:22px;padding:12px 16px}.pcr label>input,.pcr label>select{padding:10px 16px}

:focus-visible{outline:2px solid var(--at);outline-offset:2px}

/* tab bar with a sliding lens */
#tabs{position:relative;margin:12px;padding:4px;border-radius:999px;background:var(--lg-f);box-shadow:inset 0 0 0 .5px var(--lg-r)}
#tabs button{position:relative;z-index:1;background:none;border-radius:999px;color:var(--mut)}#tabs button.on{background:none;color:var(--at)}
